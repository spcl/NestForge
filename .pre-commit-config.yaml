# Setup: uv pip install -e . --group dev && pre-commit install
# Every file: pre-commit run --all-files (CI runs the same)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: tactics-headers
        name: copyright / SPDX header
        entry: python scripts/check_headers.py --fix
        language: system
        require_serial: true
        files: '\.py$'
      - id: tactics-large-files
        name: block files > 500 KiB
        entry: python scripts/check_large_files.py
        language: system
