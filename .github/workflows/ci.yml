name: CI

# uv installs from pyproject.toml (pip works the same: pip install -e ".[dev]"). dace and hpcagent_bench are
# pinned there; scripts/bump_deps.py moves the pins. Must stay credential-free so CI runs on fork PRs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # nightly too: the bench-tip job checks NestForge's bench-facing tests against the tip of the bench branch it tracks
  # (scripts/bump_deps.py) and the DaCe it pins, not only the pins
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('scripts/setup_apt.sh') }}
      - run: sudo bash scripts/setup_apt.sh --no-flang --archives "$RUNNER_TEMP/apt-archives"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hptt
          key: hptt-${{ runner.os }}-${{ hashFiles('scripts/setup_hptt.sh') }}
      # DaCe lowers a top-level TensorTranspose kernel to HPTT; it refuses the pure loop when HPTT is missing.
      - run: bash scripts/setup_hptt.sh "$RUNNER_TEMP/hptt" | tail -1 >> "$GITHUB_ENV"
      # tests/test_bench_data.py runs a bench reference, which enters the grading seal's user namespace.
      - name: Grading seal
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then echo 0 | sudo tee "$knob" > /dev/null; fi
      - run: uv pip install -e ".[dev]"
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: pytest (a skip fails the run)
        env:
          NESTFORGE_CI_NO_SKIP: '1'
        # tests/test_bench_data.py runs the bench's references, which need its OpenMP launch environment.
        run: |
          launch_env=$(python -c 'from hpcagent_bench.flags import openmp_launch_env as e; print(" ".join(f"export {k}={v};" for k, v in e().items()))')
          eval "$launch_env"
          ulimit -s "$(ulimit -H -s)"
          pytest -m "not integration and not judge and not cloudsc and not gpu and not vendor" -n auto --timeout=900 --durations=15 --cov=nestforge --cov-report=term

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('scripts/setup_apt.sh') }}
      - run: sudo bash scripts/setup_apt.sh --no-flang --archives "$RUNNER_TEMP/apt-archives"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hptt
          key: hptt-${{ runner.os }}-${{ hashFiles('scripts/setup_hptt.sh') }}
      # DaCe lowers a top-level TensorTranspose kernel to HPTT; it refuses the pure loop when HPTT is missing.
      - run: bash scripts/setup_hptt.sh "$RUNNER_TEMP/hptt" | tail -1 >> "$GITHUB_ENV"
      # The bench's reference runs in its grading seal, which enters an unprivileged user namespace
      # (ubuntu-24.04 restricts that through AppArmor).
      - name: Grading seal
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then echo 0 | sudo tee "$knob" > /dev/null; fi
      - run: uv pip install -e ".[dev]"
      - name: pytest
        # The bench's references run only under the OpenMP launch environment its judge uses
        # (hpcagent_bench.flags.openmp_launch_env), read once when numpy loads.
        run: |
          launch_env=$(python -c 'from hpcagent_bench.flags import openmp_launch_env as e; print(" ".join(f"export {k}={v};" for k, v in e().items()))')
          eval "$launch_env"
          ulimit -s "$(ulimit -H -s)"
          pytest -m "integration and not cloudsc and not gpu and not vendor" --ignore=tests/test_replay.py --timeout=900 --durations=15 --cov=nestforge --cov-report=term

  # Every reference solution replayed against the bench oracle; its own job, so the replays never share the
  # integration job's time limit.
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('scripts/setup_apt.sh') }}
      - run: sudo bash scripts/setup_apt.sh --no-flang --archives "$RUNNER_TEMP/apt-archives"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hptt
          key: hptt-${{ runner.os }}-${{ hashFiles('scripts/setup_hptt.sh') }}
      # DaCe lowers a top-level TensorTranspose kernel to HPTT; it refuses the pure loop when HPTT is missing.
      - run: bash scripts/setup_hptt.sh "$RUNNER_TEMP/hptt" | tail -1 >> "$GITHUB_ENV"
      # The bench's reference runs in its grading seal, which enters an unprivileged user namespace
      # (ubuntu-24.04 restricts that through AppArmor).
      - name: Grading seal
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then echo 0 | sudo tee "$knob" > /dev/null; fi
      - run: uv pip install -e ".[dev]"
      - name: replay
        # One reference solution per worker: each replay builds the baseline, the reference and every decoy (#42).
        run: |
          launch_env=$(python -c 'from hpcagent_bench.flags import openmp_launch_env as e; print(" ".join(f"export {k}={v};" for k, v in e().items()))')
          eval "$launch_env"
          ulimit -s "$(ulimit -H -s)"
          pytest tests/test_replay.py -m integration -n auto --timeout=900 --durations=15 --cov=nestforge --cov-report=term

  # Every phase through the plugin route, then finalize's library graded by an in-process bench judge.
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('scripts/setup_apt.sh') }}
      - run: sudo bash scripts/setup_apt.sh --no-flang --archives "$RUNNER_TEMP/apt-archives"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hptt
          key: hptt-${{ runner.os }}-${{ hashFiles('scripts/setup_hptt.sh') }}
      # DaCe lowers a top-level TensorTranspose kernel to HPTT; it refuses the pure loop when HPTT is missing.
      - run: bash scripts/setup_hptt.sh "$RUNNER_TEMP/hptt" | tail -1 >> "$GITHUB_ENV"
      # The bench's reference runs in its grading seal, which enters an unprivileged user namespace
      # (ubuntu-24.04 restricts that through AppArmor).
      - name: Grading seal
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then echo 0 | sudo tee "$knob" > /dev/null; fi
      - run: uv pip install -e ".[dev]"
      - name: pytest
        # The bench's references run only under the OpenMP launch environment its judge uses
        # (hpcagent_bench.flags.openmp_launch_env), read once when numpy loads.
        run: |
          launch_env=$(python -c 'from hpcagent_bench.flags import openmp_launch_env as e; print(" ".join(f"export {k}={v};" for k, v in e().items()))')
          eval "$launch_env"
          ulimit -s "$(ulimit -H -s)"
          pytest -m "judge and not gpu and not vendor" -n 2 --timeout=1800 --durations=15

  cloudsc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('scripts/setup_apt.sh') }}
      - run: sudo bash scripts/setup_apt.sh --no-flang --archives "$RUNNER_TEMP/apt-archives"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hptt
          key: hptt-${{ runner.os }}-${{ hashFiles('scripts/setup_hptt.sh') }}
      # DaCe lowers a top-level TensorTranspose kernel to HPTT; it refuses the pure loop when HPTT is missing.
      - run: bash scripts/setup_hptt.sh "$RUNNER_TEMP/hptt" | tail -1 >> "$GITHUB_ENV"
      # The bench's reference runs in its grading seal, which enters an unprivileged user namespace
      # (ubuntu-24.04 restricts that through AppArmor).
      - name: Grading seal
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then echo 0 | sudo tee "$knob" > /dev/null; fi
      - run: uv pip install -e ".[dev]"
      - name: pytest (every phase and random moves on canonicalized cloudsc_monolith)
        # The bench's references run only under the OpenMP launch environment its judge uses
        # (hpcagent_bench.flags.openmp_launch_env), read once when numpy loads.
        run: |
          launch_env=$(python -c 'from hpcagent_bench.flags import openmp_launch_env as e; print(" ".join(f"export {k}={v};" for k, v in e().items()))')
          eval "$launch_env"
          ulimit -s "$(ulimit -H -s)"
          pytest -m cloudsc --timeout=5400 --durations=15 -s

  bench-tip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: true
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('scripts/setup_apt.sh') }}
      - run: sudo bash scripts/setup_apt.sh --no-flang --archives "$RUNNER_TEMP/apt-archives"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hptt
          key: hptt-${{ runner.os }}-${{ hashFiles('scripts/setup_hptt.sh') }}
      # DaCe lowers a top-level TensorTranspose kernel to HPTT; it refuses the pure loop when HPTT is missing.
      - run: bash scripts/setup_hptt.sh "$RUNNER_TEMP/hptt" | tail -1 >> "$GITHUB_ENV"
      # The plugin tests read the bench's references, which run in its grading seal (see integration).
      - name: Grading seal
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then echo 0 | sudo tee "$knob" > /dev/null; fi
      - name: Pin the tip of the tracked bench branch and the DaCe and relayout it pins
        run: python scripts/bump_deps.py && git diff pyproject.toml
      - run: uv pip install -e ".[dev]"
      - name: "pytest (the tests that call the bench: plugin, corpus, manifests, session process)"
        run: |
          launch_env=$(python -c 'from hpcagent_bench.flags import openmp_launch_env as e; print(" ".join(f"export {k}={v};" for k, v in e().items()))')
          eval "$launch_env"
          ulimit -s "$(ulimit -H -s)"
          pytest -m "not cloudsc and not gpu and not vendor" -n auto --timeout=900 \
            tests/test_bench_plugin.py tests/test_corpus_emit.py tests/test_manifest_signature.py \
            tests/test_abi_order.py tests/test_import_isolation.py tests/test_session_process.py
