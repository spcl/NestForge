name: CI

# uv installs from pyproject.toml: hpcagent-bench, DaCe extended, dace-relayout and FP-Arena come from PyPI;
# scripts/bump_deps.py points the bench-tip job at the tip of the bench branch.
# Must stay credential-free so CI runs on fork PRs. Every job sets up through .github/actions/setup.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # nightly too: the bench-tip job checks Tactics' bench-facing tests against the tip of the bench branch it tracks
  # (scripts/bump_deps.py), not only the pin
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pre-commit run --all-files --show-diff-on-failure
      # strict typing ([tool.mypy]); the tests hold a second conftest module, so they are checked on their own
      - name: mypy --strict
        run: mypy && mypy tests
      - name: pytest (a skip fails the run)
        env:
          TACTICS_CI_NO_SKIP: '1'
        run: |
          ulimit -s "$(ulimit -H -s)"
          pytest -m "not integration and not judge and not cloudsc and not gpu and not vendor" -n auto --timeout=900 --durations=15 --cov=tactics --cov-report=term

  # The integration tests, then every phase through the plugin route with finalize's library graded by an
  # in-process bench judge: one runner, as the judge tests alone take minutes.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: pytest
        run: |
          ulimit -s "$(ulimit -H -s)"
          pytest -m "integration and not cloudsc and not gpu and not vendor" --ignore=tests/test_replay.py --timeout=900 --durations=15 --cov=tactics --cov-report=term
      - name: pytest (judge)
        run: |
          ulimit -s "$(ulimit -H -s)"
          pytest -m "judge and not gpu and not vendor" -n 2 --timeout=1800 --durations=15

  # Every reference solution replayed against the bench oracle; its own job, so the replays never share the
  # integration job's time limit.
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: replay
        # One reference solution per worker: each replay builds the baseline and the reference (#42).
        run: |
          ulimit -s "$(ulimit -H -s)"
          pytest tests/test_replay.py -m integration -n auto --timeout=900 --durations=15 --cov=tactics --cov-report=term

  cloudsc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The tests share nothing but the canonicalized program, which each runner builds in minutes: three runners of
    # 20-30 minutes each cut the wall time to the slowest (one runner for performance and moves took 43 minutes).
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: performance
            select: tests/test_cloudsc_phases.py -k test_performance_reports
          - name: phases
            select: tests/test_cloudsc_phases.py -k "not test_performance_reports"
          - name: moves
            select: tests/test_cloudsc_moves.py
    name: cloudsc (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: pytest (every phase and random moves on canonicalized cloudsc_monolith)
        run: |
          ulimit -s "$(ulimit -H -s)"
          pytest -m cloudsc ${{ matrix.shard.select }} --timeout=5400 --durations=15 -s

  bench-tip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          bench-tip: 'true'
      - name: "pytest (the tests that call the bench: plugin, corpus, manifests, session process)"
        run: |
          ulimit -s "$(ulimit -H -s)"
          pytest -m "not cloudsc and not gpu and not vendor" -n auto --timeout=900 \
            tests/test_bench_plugin.py tests/test_corpus_emit.py tests/test_manifest_signature.py \
            tests/test_abi_order.py tests/test_import_isolation.py tests/test_session_process.py
