name: CI

# uv installs from pyproject.toml: hpcagent-bench, DaCe extended, dace-relayout and FP-Arena come from PyPI.
# Must stay credential-free so CI runs on fork PRs. Every job sets up through .github/actions/setup.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pre-commit run --all-files --show-diff-on-failure
      # strict typing ([tool.mypy]); the tests hold a second conftest module, so they are checked on their own
      - name: mypy --strict
        run: mypy && mypy tests
      - name: pytest (a skip fails the run)
        env:
          TACTICS_CI_NO_SKIP: '1'
        run: |
          ulimit -s "$(ulimit -H -s)"
          pytest -m "not integration and not judge and not cloudsc and not gpu and not vendor" -n auto --timeout=900 --durations=15 --cov=tactics --cov-report=term

  # The integration tests, then every phase through the plugin route with finalize's library graded by an
  # in-process bench judge: one runner, as the judge tests alone take minutes.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: pytest
        run: |
          ulimit -s "$(ulimit -H -s)"
          pytest -m "integration and not cloudsc and not gpu and not vendor" --ignore=tests/test_replay.py -n 2 --timeout=900 --durations=15 --cov=tactics --cov-report=term
      - name: pytest (judge)
        run: |
          ulimit -s "$(ulimit -H -s)"
          pytest -m "judge and not gpu and not vendor" -n 2 --timeout=1800 --durations=15

  # Every reference solution replayed against the bench oracle; its own job, so the replays never share the
  # integration job's time limit.
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: replay
        # One reference solution per worker: each replay builds the baseline and the reference (#42).
        run: |
          ulimit -s "$(ulimit -H -s)"
          pytest tests/test_replay.py -m integration -n auto --timeout=900 --durations=15 --cov=tactics --cov-report=term

  cloudsc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The tests share nothing but the canonicalized program, which each runner builds in minutes: three runners of
    # 20-30 minutes each cut the wall time to the slowest (one runner for performance and moves took 43 minutes).
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: performance
            select: tests/test_cloudsc_phases.py -k test_performance_reports
          - name: phases
            select: tests/test_cloudsc_phases.py -k "not test_performance_reports"
          - name: moves
            select: tests/test_cloudsc_moves.py
    name: cloudsc (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: pytest (every phase and random moves on canonicalized cloudsc_monolith)
        run: |
          ulimit -s "$(ulimit -H -s)"
          pytest -m cloudsc ${{ matrix.shard.select }} --timeout=5400 --durations=15 -s


  # Tactics as a bench user plugin, as the bench's former user-plugins job ran it: the bench checked out at a release
  # tag as the workspace root (its setup action syncs its own uv.lock), tactics installed by the plugin's [install]
  # command, then every episode of plugin.toml's [ci] block run against a judge that must grade the submission correct.
  bench-plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BENCH_TAG: abef4b6361c5f89720269e65f16ebeccefe5924a  # hpcagent-bench main until v1.0.4 is tagged
      PYTHON_VERSION: '3.14'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: spcl/HPCAgent-Bench
          ref: ${{ env.BENCH_TAG }}
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          path: tactics
      - uses: ./.github/actions/setup
      - name: Install the plugin and check that it loads
        run: |
          dirs="$GITHUB_WORKSPACE/tactics/plugin/tactics"
          echo "HPCAGENT_BENCH_USER_PLUGIN_DIRS=$dirs" >> "$GITHUB_ENV"
          HPCAGENT_BENCH_USER_PLUGIN_DIRS="$dirs" python -m hpcagent_bench.plugins install
          HPCAGENT_BENCH_USER_PLUGIN_DIRS="$dirs" python -m hpcagent_bench.plugins check
      - name: Stub episodes and every packet's prompts
        timeout-minutes: 40
        run: |
          python -m pytest -p no:cacheprovider -p tests.no_silent_skips -rfEs -v --timeout=1800 --durations=0 \
            -m user_plugins tests/test_user_plugin_episodes.py
