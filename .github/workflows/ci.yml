name: CI

# uv installs from pyproject.toml (pip works the same: pip install -e ".[dev]"). dace and hpcagent_bench are
# pinned there; scripts/bump_deps.py moves the pins. Must stay credential-free so CI runs on fork PRs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: sudo bash scripts/setup_apt.sh
      - run: uv pip install -e ".[dev,agent]"
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: pytest (a skip fails the run)
        env:
          NESTFORGE_CI_NO_SKIP: '1'
        run: pytest -m "not integration and not gpu and not vendor" -n auto --timeout=900 --cov=nestforge --cov-report=term

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: sudo bash scripts/setup_apt.sh
      - run: uv pip install -e ".[dev,agent]"
      - name: pytest
        run: pytest -m "integration and not gpu and not vendor" --timeout=900 --cov=nestforge --cov-report=term
