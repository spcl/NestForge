name: CI

# uv installs from pyproject.toml (pip works the same: pip install -e ".[dev]"). dace and hpcagent_bench are
# pinned there; scripts/bump_deps.py moves the pins. Must stay credential-free so CI runs on fork PRs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # nightly: the bench-tip job checks NestForge against the bench release and DaCe extended tips, not only the pins
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: sudo bash scripts/setup_apt.sh
      - run: uv pip install -e ".[dev]"
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: pytest (a skip fails the run)
        env:
          NESTFORGE_CI_NO_SKIP: '1'
        run: pytest -m "not integration and not cloudsc and not gpu and not vendor" -n auto --timeout=900 --durations=15 --cov=nestforge --cov-report=term

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: sudo bash scripts/setup_apt.sh
      # The bench's reference runs in its grading seal, which enters an unprivileged user namespace
      # (ubuntu-24.04 restricts that through AppArmor).
      - name: Grading seal
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then echo 0 | sudo tee "$knob" > /dev/null; fi
      - run: uv pip install -e ".[dev]"
      - name: pytest
        # The bench's references run only under the OpenMP launch environment its judge uses
        # (hpcagent_bench.flags.openmp_launch_env), read once when numpy loads.
        run: |
          eval "$(python -c 'from hpcagent_bench.flags import openmp_launch_env as e; print(" ".join(f"export {k}={v};" for k, v in e().items()))')"
          ulimit -s "$(ulimit -H -s)"
          pytest -m "integration and not cloudsc and not gpu and not vendor" --timeout=900 --durations=15 --cov=nestforge --cov-report=term

  cloudsc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: sudo bash scripts/setup_apt.sh
      # The bench's reference runs in its grading seal, which enters an unprivileged user namespace
      # (ubuntu-24.04 restricts that through AppArmor).
      - name: Grading seal
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then echo 0 | sudo tee "$knob" > /dev/null; fi
      - run: uv pip install -e ".[dev]"
      - name: pytest (every phase and random moves on canonicalized cloudsc_monolith)
        # The bench's references run only under the OpenMP launch environment its judge uses
        # (hpcagent_bench.flags.openmp_launch_env), read once when numpy loads.
        run: |
          eval "$(python -c 'from hpcagent_bench.flags import openmp_launch_env as e; print(" ".join(f"export {k}={v};" for k, v in e().items()))')"
          ulimit -s "$(ulimit -H -s)"
          pytest -m cloudsc --timeout=5400 --durations=15 -s

  bench-tip:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: true
      - run: sudo bash scripts/setup_apt.sh
      - name: Pin the tips of the bench release and DaCe extended
        run: python scripts/bump_deps.py && git diff pyproject.toml
      - run: uv pip install -e ".[dev]"
      - run: pytest -m "not integration and not cloudsc and not gpu and not vendor" -n auto --timeout=900
