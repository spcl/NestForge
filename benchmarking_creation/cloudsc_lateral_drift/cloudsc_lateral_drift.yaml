# Repo-local kernel (see benchmarking_creation/README.md).
# CloudSC rain sedimentation (carried down the levels, columns independent) followed by an implicit lateral drift
# of the flux (carried along the contiguous column axis, levels independent), eastward or westward per level.
# Source lines and the edit: see cloudsc_lateral_drift_numpy.py.
name: CloudSC Lateral Drift
level: 2
parameters:
  # NCLDTOP = 15 as in the CloudSC NumPy port; NLEV must exceed it. KLON at S is not a multiple of any block.
  S:
    NLEV: 30
    KLON: 263
    NCLDTOP: 15
  M:
    NLEV: 137
    KLON: 32768
    NCLDTOP: 15
  L:
    NLEV: 137
    KLON: 65537
    NCLDTOP: 15
  XL:
    NLEV: 137
    KLON: 131073
    NCLDTOP: 15
# Structured inputs (monotone pressure, positive temperature, limiter that binds): initialize() in cloudsc_lateral_drift.py.
args:
  pap: "(NLEV, KLON)"
  paph: "(NLEV + 1, KLON)"
  ztp1: "(NLEV, KLON)"
  zqr: "(NLEV, KLON)"
  pfsnow: "(NLEV + 1, KLON)"
  pfplsx: "(NLEV + 1, KLON)"
  flx: "(NLEV + 1, KLON)"
  outE: "(NLEV + 1, KLON)"
  outW: "(NLEV + 1, KLON)"
  out: {shape: "(NLEV + 1, KLON)", out: true}
  cap: "(NLEV + 1, KLON)"
  east: {shape: "(NLEV + 1,)", dtype: int32}
chain_length:
  out: KLON
