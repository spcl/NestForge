# Copied from HPCAgent-Bench e63f9f1 (benchmarks/scientific_computing/sparse_linear_algebra/dbcsr); slot E3 of the thesis
# benchmark set. Benchmark record: dbcsr.md. Changed 2026-10-23: presets M, L and XL use 4x4 blocks at density 0.05 (the
# corpus has 22 to 32 at 0.25), so the padded-slot guard the move hoists is a large share of the work (1.04x -> 2.46x on
# 1 thread, Daint jobs 5127152 to 5127291). The oracle, the generator and the program are unchanged.
name: DBCSR Block-Sparse Multiply
short-name: DBCSR
level: 3
parameters:
  S:
    n_block_rows: 8
    n_block_cols: 8
    n_block_inner: 8
    block_size: 4
    density: 0.25
  M:
    n_block_rows: 180
    n_block_cols: 180
    n_block_inner: 180
    block_size: 4
    density: 0.05
  L:
    n_block_rows: 321
    n_block_cols: 321
    n_block_inner: 321
    block_size: 4
    density: 0.05
  XL:
    n_block_rows: 574
    n_block_cols: 574
    n_block_inner: 574
    block_size: 4
    density: 0.05
config:
  multrec_limit: {value: 512, selects: tile}
  seed: {value: 0, selects: seed}
args:
  a_index: {shape: "(n_block_rows * n_block_inner, 3)", dtype: int32}
  b_index: {shape: "(n_block_inner * n_block_cols, 3)", dtype: int32}
  a_blocks: {shape: "(n_block_rows * n_block_inner, block_size, block_size)", dtype: float64}
  b_blocks: {shape: "(n_block_inner * n_block_cols, block_size, block_size)", dtype: float64}
  m_sizes: {shape: "(n_block_rows,)", dtype: int32}
  n_sizes: {shape: "(n_block_cols,)", dtype: int32}
  k_sizes: {shape: "(n_block_inner,)", dtype: int32}
  C: {shape: "(n_block_rows * block_size, n_block_cols * block_size)", dtype: float64, out: true}
allowed_precisions:
- fp64
