# HPCAgent-Bench benchmark manifest -- adding a benchmark: see README.md.
# provenance: {kind: derived, upstream: omen, via: [npbench]}
# Derived from HPCAgent-Bench e63f9f1 scientific_computing/dense_linear_algebra/scattering_self_energies (W3 variant v1c): same arguments, presets and
# oracle math; the DaCe program (scattering_self_energies_m2_dace.py, hand-written) puts the atom loop under two reduction loops and writes the
# 10 x 10 products as explicit orbital loops. Benchmark record: scattering_self_energies_m2.md; how to optimize it: README.md.
name: Scattering Self Energies (2-pull variant)
short-name: Self Energies
level: 2
parameters:
  S:
    Nkz: 2
    NE: 4
    Nqz: 2
    Nw: 2
    N3D: 2
    NA: 6
    NB: 2
  # M has Nkz * NE = 8 (k, E) points (2026-10-23; was 4 x 16 = 64): fewer than the 72 threads, so the default's best build
  # (k, E collapsed) leaves threads idle and the route's (k, E, a) map fills them (9.8x over that build, job 5127570).
  M:
    Nkz: 2
    NE: 4
    Nqz: 4
    Nw: 2
    N3D: 3
    NA: 128
    NB: 4
  L:
    Nkz: 7
    NE: 40
    Nqz: 8
    Nw: 4
    N3D: 2
    NA: 459
    NB: 4
  XL:
    Nkz: 12
    NE: 102
    Nqz: 16
    Nw: 4
    N3D: 2
    NA: 1645
    NB: 4
args:
  neigh_idx: {shape: "(NA, NB)", dtype: int32, index_array: true}
  dH: {shape: "(NA, NB, N3D, Norb, Norb)", dtype: complex128}
  G: {shape: "(Nkz, NE, NA, Norb, Norb)", dtype: complex128}
  D: {shape: "(Nqz, Nw, NA, NB, N3D, N3D)", dtype: complex128}
  Sigma: {shape: "(Nkz, NE, NA, Norb, Norb)", dtype: complex128, out: true}
init:
  constants:
    Norb: 10
