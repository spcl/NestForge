[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nest-forge"
version = "0.0.1"
description = "Agentic optimization harness for DaCe programs: seven stages, each with a deterministic default."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Yakup Budanaz", email = "budanaz.yakup@gmail.com" }]
keywords = ["dace", "sdfg", "loop-nest", "code-generation", "compilers", "autotuning", "hpc", "llm-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "numpy",
    "pydantic>=2",
    "pyyaml",
    "sympy",
    # The tip of HPCAgent-Bench main, and the DaCe and relayout commits it pins (the bench owns them);
    # `python scripts/bump_deps.py` moves all three. The bench pins DaCe and relayout only in [tool.uv.sources], which
    # pip never reads (PyPI's relayout is another project), so they are pinned here and [tool.uv] repeats them.
    "dace @ git+https://github.com/spcl/dace.git@7683e14380e3cb53a13a4dad2651a52dd81cb799",
    "hpcagent_bench @ git+https://github.com/spcl/HPCAgent-Bench.git@b2ce25e397d98b4fbe211d7aa46fd33b748ce4cc",
    # The bench plugin (plugin/nestforge) runs on the agent side too.
    "hpcagent-agent @ git+https://github.com/spcl/HPCAgent-Bench.git@b2ce25e397d98b4fbe211d7aa46fd33b748ce4cc#subdirectory=agent",
    "relayout @ git+https://github.com/ThrudPrimrose/relayout.git@2718b2fee48a0a60b0ed1b65f281d9636e75f0f8",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    # Pinned to the pre-commit hook's rev: a new release widens the default rules.
    "ruff==0.15.10",
]

[project.urls]
Homepage = "https://github.com/spcl/NestForge"
Repository = "https://github.com/spcl/NestForge"

[tool.uv]
override-dependencies = [
    "dace @ git+https://github.com/spcl/dace.git@7683e14380e3cb53a13a4dad2651a52dd81cb799",
    "relayout @ git+https://github.com/ThrudPrimrose/relayout.git@2718b2fee48a0a60b0ed1b65f281d9636e75f0f8",
]

[tool.setuptools.packages.find]
include = ["nestforge*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "UP", "I", "FLY", "Q", "C4", "DTZ", "T10", "EXE", "INT", "ISC", "PYI", "RSE", "TID", "W", "PERF", "FURB"]
ignore = ["UP031", "F821", "F841", "F823", "C408", "PYI041", "PYI042", "PYI016", "PERF203", "FURB136"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405", "I"]

[tool.ruff.format]
exclude = ["*.ipynb"]

[tool.pyright]
include = ["nestforge", "nestforge_bench", "scripts", "examples", "conftest.py"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
markers = [
    "integration: compiles and runs kernels; slow, its own CI job",
    "judge: a finalized library graded by an in-process bench judge; its own CI job",
    "e2e: end-to-end with g++/clang++, so it runs on CI",
    "gpu: needs a CUDA device, never on CI",
    "vendor: needs a vendor compiler or library not installed on CI",
    "cloudsc: every phase and random moves on canonicalized cloudsc_monolith against the bench reference; its own CI job",
]

[tool.coverage.run]
# Forked children leave through os._exit, which skips coverage's atexit save.
patch = ["_exit"]
parallel = true
