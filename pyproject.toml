[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nest-forge"
version = "0.0.1"
description = "Agentic optimization harness for DaCe programs: seven stages, each with a deterministic default."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Yakup Budanaz", email = "budanaz.yakup@gmail.com" }]
keywords = ["dace", "sdfg", "loop-nest", "code-generation", "compilers", "autotuning", "hpc", "llm-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "numpy",
    "pyyaml",
    "sympy",
    # Pinned tips of dace@extended and HPCAgent-Bench@main; `python scripts/bump_deps.py` moves both to the
    # current tips. Bump whenever DaCe extended gains a transformation or fix NestForge needs.
    "dace @ git+https://github.com/spcl/dace.git@2857751dc098c0ed38cf020d0d975b99072f3582",
    "hpcagent_bench @ git+https://github.com/spcl/HPCAgent-Bench.git@26a4f0cfc1540cead109dfc8d736f1c45263e390",
]

[project.optional-dependencies]
# The agent loop's LLM clients; install one or both.
agent = ["anthropic", "openai"]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    # Pinned to the pre-commit hook's rev: a new release widens the default rules.
    "ruff==0.15.10",
]

[project.urls]
Homepage = "https://github.com/spcl/NestForge"
Repository = "https://github.com/spcl/NestForge"

[tool.setuptools.packages.find]
include = ["nestforge*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Default rules plus pyupgrade, so annotations use builtin generics and `X | None`, and a complexity ceiling.
select = ["E4", "E7", "E9", "F", "UP", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Tests import after a module-level skip guard, use lambda helpers, and keep the reference's math names.
"tests/*" = ["E402", "E731", "E741"]

[tool.pyright]
include = ["nestforge", "scripts", "examples", "conftest.py"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
markers = [
    "integration: compiles and runs kernels; slow, its own CI job",
    "e2e: end-to-end with g++/clang++, so it runs on CI",
    "gpu: needs a CUDA device, never on CI",
    "vendor: needs a vendor compiler or library not installed on CI",
]

[tool.coverage.run]
# Forked children leave through os._exit, which skips coverage's atexit save.
patch = ["_exit"]
parallel = true
