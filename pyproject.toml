[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tactics"
version = "0.1.0"
description = "Reproducible transformation-based agents and a harness for DaCe: tactics applied as legal moves, replayed as recipes."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Yakup Budanaz", email = "ybudanaz@ethz.ch" }]
keywords = ["dace", "sdfg", "loop-nest", "code-generation", "compilers", "autotuning", "hpc", "llm-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "numpy",
    "pydantic>=2",
    "pyyaml",
    "sympy",
    # DaCe's einsum of three or more operands imports it, but DaCe lists it only under its testing extras.
    "opt-einsum>=3.0",
    # DaCe extended (import dace), released from the ThrudPrimrose/dace fork; never also install spcl's PyPI `dace`.
    "dace-extended>=1.0.0",
    "hpcagent-bench>=1.0.0",
    # The bench plugin (plugin/tactics) runs on the agent side too.
    "hpcagent-agent>=1.0.0",
    "dace-relayout>=0.1.0",
]

[project.optional-dependencies]
# The relayout move's SDFG cast: relayout's `fparena` extra. FP-Arena is not on PyPI, so this extra installs from a
# checkout only (its commit is in [tool.uv.sources]).
fparena = ["dace-relayout[fparena]>=0.1.0"]
dev = [
    "tactics[fparena]",
    "pre-commit",
    "mypy",
    "types-PyYAML",
    "pyright",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    # scripts/answer_tokens.py counts answer tokens: OpenAI's encodings, and a model's own tokenizer.json.
    "tiktoken",
    "tokenizers",
    # Pinned to the pre-commit hook's rev: a new release widens the default rules.
    "ruff==0.17.6",
]

[project.urls]
Homepage = "https://github.com/spcl/tactics"
Repository = "https://github.com/spcl/tactics"
Changelog = "https://github.com/spcl/tactics/blob/main/CHANGELOG.md"

[tool.uv.sources]
# The tip of HPCAgent-Bench main, and the DaCe and relayout commits that bench commit pins (the bench owns them):
# `python scripts/bump_deps.py` moves all of them. A PyPI install reads none of this.
# shortcut: dace-extended 1.0.0 is not on PyPI yet; the fork's release commit extended-v1.0.0 (spcl/dace 69626c5 plus
# the release commit) stands in until it is, then delete this source.
dace-extended = { git = "https://github.com/ThrudPrimrose/dace.git", rev = "736d231446eb0aa8423d1ad4c87c8c65b8537672" }
hpcagent-bench = { git = "https://github.com/spcl/HPCAgent-Bench.git", rev = "62e5d91e17de28371342279b78d71321adc49faa" }
hpcagent-agent = { git = "https://github.com/spcl/HPCAgent-Bench.git", rev = "62e5d91e17de28371342279b78d71321adc49faa", subdirectory = "agent" }
dace-relayout = { git = "https://github.com/ThrudPrimrose/dace-relayout.git", rev = "bec607d55076fbab455b498649030c1f4cc8caa2" }
fp-arena = { git = "https://github.com/spcl/FP-Arena.git", rev = "08465359af8666927ab6b53bcfdce1865a6c34e1" }

[tool.uv]
# shortcut: the pinned bench still requires `relayout` (PyPI's is another project), while dace-relayout installs the
# same module; drop the bench's requirement until the bench pins dace-relayout, then delete this override.
# shortcut: the pinned bench still requires plain `dace`, which installs the same `dace` package as dace-extended;
# drop it until the bench requires dace-extended, then delete that entry.
override-dependencies = [
    "relayout ; sys_platform == 'never'",
    "dace ; sys_platform == 'never'",
]

[tool.setuptools.packages.find]
include = ["tactics*", "reference_solutions"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "UP", "I", "FLY", "Q", "C4", "DTZ", "T10", "EXE", "INT", "ISC", "PYI", "RSE", "TID", "W", "PERF", "FURB"]
ignore = ["UP031", "F821", "F841", "F823", "C408", "PYI041", "PYI042", "PYI016", "PERF203", "FURB136"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405", "I"]

[tool.ruff.format]
exclude = ["*.ipynb"]

[tool.pyright]
include = ["tactics", "tactics_bench", "scripts", "examples", "conftest.py"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.mypy]
python_version = "3.12"
strict = true
# tests run on their own (`mypy tests`): they hold a second conftest module
files = ["tactics", "tactics_bench", "scripts", "examples", "conftest.py"]
# tests import their shared helpers as top-level modules, as pytest's rootdir insertion does; typings holds the
# one DaCe stub (typings/dace)
mypy_path = ["tests", "typings"]

[[tool.mypy.overrides]]
# untyped dependencies: their names are Any, so code that uses them is checked only at its own annotations
module = ["dace.*", "hpcagent_bench.*", "hpcagent_agent.*", "relayout.*", "fp_arena.*", "sympy.*", "cupy.*", "hpcagent_bench_plugins.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# these subclass a class of an untyped dependency (DaCe's OffloadToAccelerator, the bench's FlavorOptimizer,
# JudgeAnswer and JudgeHandler); the subclass's own members stay checked
module = ["tactics.stages.placement", "tactics_bench", "answer_tokens", "test_bench_plugin"]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# DaCe's MPI frontend spells a call as the C API does (buffer, peer, tag, request); mpi4py's stubs type another form
module = ["comm_programs", "comm_rank_programs"]
disable_error_code = ["call-arg"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
# a refusal without a class fails the test that met it
filterwarnings = ["error::tactics.records.UnclassedRefusal"]
markers = [
    "integration: compiles and runs kernels; slow, its own CI job",
    "judge: a finalized library graded by an in-process bench judge; its own CI job",
    "e2e: end-to-end with g++/clang++, so it runs on CI",
    "gpu: needs a CUDA device, never on CI",
    "vendor: needs a vendor compiler or library not installed on CI",
    "mpi: launches MPI ranks (mpirun, Open MPI)",
    "cloudsc: every phase and random moves on canonicalized cloudsc_monolith against the bench reference; its own CI job",
]

[tool.coverage.run]
# Forked children leave through os._exit, which skips coverage's atexit save.
patch = ["_exit"]
parallel = true
