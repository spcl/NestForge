[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nest-forge"
version = "0.0.1"
description = "Agentic optimization harness for DaCe programs: seven stages, each with a deterministic default."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Yakup Budanaz", email = "budanaz.yakup@gmail.com" }]
keywords = ["dace", "sdfg", "loop-nest", "code-generation", "compilers", "autotuning", "hpc", "llm-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "numpy",
    "pydantic>=2",
    "pyyaml",
    "sympy",
    # DaCe's einsum of three or more operands imports it, but DaCe lists it only under its testing extras.
    "opt-einsum>=3.0",
    # The tip of HPCAgent-Bench main, and the DaCe and relayout commits it pins (the bench owns them);
    # `python scripts/bump_deps.py` moves all three. The bench pins DaCe and relayout only in [tool.uv.sources], which
    # pip never reads (PyPI's relayout is another project), so they are pinned here and [tool.uv] repeats them.
    "dace @ git+https://github.com/spcl/dace.git@38ef4a32850dac14e594aba3fad4b696a10844be",
    "hpcagent_bench @ git+https://github.com/spcl/HPCAgent-Bench.git@28a0dd3e562cb703c7a9b6174175db81a4276eee",
    # The bench plugin (plugin/nestforge) runs on the agent side too.
    "hpcagent-agent @ git+https://github.com/spcl/HPCAgent-Bench.git@28a0dd3e562cb703c7a9b6174175db81a4276eee#subdirectory=agent",
    "relayout @ git+https://github.com/ThrudPrimrose/relayout.git@bae86a7ada1ad0342bdfb5429ec99ea1cb5070aa",
    # relayout's SDFG cast (the relayout move's cast), its `fparena` extra, at the commit relayout pins.
    "fp-arena @ git+https://github.com/spcl/FP-Arena.git@08465359af8666927ab6b53bcfdce1865a6c34e1",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "mypy",
    "types-PyYAML",
    "pyright",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    # scripts/answer_tokens.py counts answer tokens: OpenAI's encodings, and a model's own tokenizer.json.
    "tiktoken",
    "tokenizers",
    # Pinned to the pre-commit hook's rev: a new release widens the default rules.
    "ruff==0.17.6",
]

[project.urls]
Homepage = "https://github.com/spcl/NestForge"
Repository = "https://github.com/spcl/NestForge"

[tool.uv]
override-dependencies = [
    "dace @ git+https://github.com/spcl/dace.git@38ef4a32850dac14e594aba3fad4b696a10844be",
    "relayout @ git+https://github.com/ThrudPrimrose/relayout.git@bae86a7ada1ad0342bdfb5429ec99ea1cb5070aa",
]

[tool.setuptools.packages.find]
include = ["nestforge*", "reference_solutions"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "UP", "I", "FLY", "Q", "C4", "DTZ", "T10", "EXE", "INT", "ISC", "PYI", "RSE", "TID", "W", "PERF", "FURB"]
ignore = ["UP031", "F821", "F841", "F823", "C408", "PYI041", "PYI042", "PYI016", "PERF203", "FURB136"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405", "I"]

[tool.ruff.format]
exclude = ["*.ipynb"]

[tool.pyright]
include = ["nestforge", "nestforge_bench", "scripts", "examples", "conftest.py"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.mypy]
python_version = "3.12"
strict = true
# tests run on their own (`mypy tests`): they hold a second conftest module
files = ["nestforge", "nestforge_bench", "scripts", "examples", "conftest.py"]
# tests import their shared helpers as top-level modules, as pytest's rootdir insertion does; typings holds the
# one DaCe stub (typings/dace)
mypy_path = ["tests", "typings"]

[[tool.mypy.overrides]]
# untyped dependencies: their names are Any, so code that uses them is checked only at its own annotations
module = ["dace.*", "hpcagent_bench.*", "hpcagent_agent.*", "relayout.*", "fp_arena.*", "sympy.*", "cupy.*", "hpcagent_bench_plugins.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# these subclass a class of an untyped dependency (DaCe's OffloadToAccelerator, the bench's FlavorOptimizer,
# JudgeAnswer and JudgeHandler); the subclass's own members stay checked
module = ["nestforge.stages.placement", "nestforge_bench", "answer_tokens", "test_bench_plugin"]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# DaCe's MPI frontend spells a call as the C API does (buffer, peer, tag, request); mpi4py's stubs type another form
module = ["comm_programs", "comm_rank_programs"]
disable_error_code = ["call-arg"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
# a refusal without a class fails the test that met it
filterwarnings = ["error::nestforge.records.UnclassedRefusal"]
markers = [
    "integration: compiles and runs kernels; slow, its own CI job",
    "judge: a finalized library graded by an in-process bench judge; its own CI job",
    "e2e: end-to-end with g++/clang++, so it runs on CI",
    "gpu: needs a CUDA device, never on CI",
    "vendor: needs a vendor compiler or library not installed on CI",
    "mpi: launches MPI ranks (mpirun, Open MPI)",
    "cloudsc: every phase and random moves on canonicalized cloudsc_monolith against the bench reference; its own CI job",
]

[tool.coverage.run]
# Forked children leave through os._exit, which skips coverage's atexit save.
patch = ["_exit"]
parallel = true
