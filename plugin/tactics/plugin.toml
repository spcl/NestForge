# Tactics as a user plugin: point HPCAGENT_BENCH_USER_PLUGIN_DIRS at this folder.
name = "tactics"
description = "Whole-program DaCe optimization: legal moves, scoped kernels, placement, with performance feedback."
# Every kernel links LLVM libomp; the bench starts the session process in libomp's OpenMP context.
openmp = "libomp"
# The routes import the benchmark through hpcagent_bench.plugin_api only; `plugins check` enforces it.
api = 1

# The packages tactics, tactics_bench and reference_solutions, built from the repository into the judge's
# interpreter; their dependencies are the benchmark's own, at its pins.
[install]
root = "../.."
command = ["uv", "pip", "install", "--python", "{python}", "--no-deps", "{root}"]

# What HPCAgent-Bench's user-plugins CI runs: the stub agent through the packet's tools, the reference and default
# columns, and the two-stage stub through every phase of the packet it walks.
[ci]
optimizers = [
    "dace_cpu_canon_tactics_stub",
    "dace_cpu_canon_tactics_reference",
    "dace_cpu_canon_tactics_default",
    "dace_cpu_canon_tactics_cpf_nowave",
    "dace_cpu_canon_tactics_two_stage",
]
kernels = ["jacobi_1d", "tsvc_2_s231"]
language = "cpp"
packets = { dace_cpu_canon_tactics_two_stage = "tactics-two-stage" }

# Tactics owns its phases (tactics/stages/phases.py): structured, scopes, scoped, kernels. A packet names the
# phases its agent runs in TACTICS_AGENT_PHASES (unset: every phase); Tactics runs the others' defaults and gates
# each tool by phase. advance_phase, undo_phase and return_to_phase move between them.

# The agent chooses the moves; scopes, placement, kernel code and compiler configuration run on their defaults. It
# writes no code: build and language guidance are off, and Tactics' own texts say how to send and finish.
[packets.tactics]
name = "Tactics"
skills = ["tactics"]
tools = ["get_cpf", "view_tree", "get_work_depth", "list_move_kinds", "list_moves", "apply_move", "apply_moves", "tune_move", "run_defaults", "get_performance", "applied_moves", "finalize", "profile", "score", "submit"]
overlays = ["tactics:prompt/overlay.yaml", "tactics:prompt/no-cpp-guide.yaml", "tactics:prompt/phase-structured.yaml"]
# The judge takes only a library, and the agent has no shell or editor: what is graded is what the tools built.
env = { JUDGE_INPUT_MODE = "library", HPCAGENT_BENCH_NATIVE_TOOLS = "Read", TACTICS_AGENT_PHASES = "structured" }

# tactics, and the agent may ask for a transformation no move offers (E6, round 1); E1 runs without requests.
[packets.tactics-requests]
extends = "tactics"
name = "Tactics (move requests)"
tools = ["get_cpf", "view_tree", "get_work_depth", "list_move_kinds", "list_moves", "apply_move", "apply_moves", "tune_move", "run_defaults", "get_performance", "applied_moves", "finalize", "profile", "score", "submit", "request_transformation"]

# The baselines that choose compiler passes instead of moves (the paper's LLVM and MLIR agents): the same program,
# entry and library as Tactics', every kernel built through the agent's pipeline; no move, no written code.
[packets.tactics-llvm]
extends = "tactics"
name = "LLVM passes (baseline)"
tools = ["get_cpf", "view_tree", "set_llvm_passes", "get_performance", "applied_moves", "finalize", "profile", "score", "submit"]
overlays = ["tactics:prompt/overlay.yaml", "tactics:prompt/no-cpp-guide.yaml", "tactics:prompt/passes-llvm.yaml"]
skills = []
env = { JUDGE_INPUT_MODE = "library", HPCAGENT_BENCH_NATIVE_TOOLS = "Read", TACTICS_DISABLED_FAMILIES = "all" }

[packets.tactics-mlir]
extends = "tactics"
name = "MLIR passes (baseline)"
tools = ["get_cpf", "view_tree", "set_mlir_passes", "get_performance", "applied_moves", "finalize", "profile", "score", "submit"]
overlays = ["tactics:prompt/overlay.yaml", "tactics:prompt/no-cpp-guide.yaml", "tactics:prompt/passes-mlir.yaml"]
skills = []
env = { JUDGE_INPUT_MODE = "library", HPCAGENT_BENCH_NATIVE_TOOLS = "Read", TACTICS_DISABLED_FAMILIES = "all" }

# The pass-move agent (docs/design/mlir-llvm-agent.md): named MLIR, then LLVM, passes one at a time, with the loops
# after each move; a study column on scicomp40. CPU kernels only until the bench image has MLIR's CUDA runtime (B16).
[packets.tactics-passes]
extends = "tactics"
name = "MLIR and LLVM pass moves (baseline)"
tools = ["get_cpf", "view_tree", "view_ir", "list_pass_moves", "apply_pass_move", "advance_pass_phase", "get_performance", "applied_moves", "finalize", "profile", "score", "submit"]
overlays = ["tactics:prompt/overlay.yaml", "tactics:prompt/no-cpp-guide.yaml", "tactics:prompt/passes-moves.yaml"]
skills = []
env = { JUDGE_INPUT_MODE = "library", HPCAGENT_BENCH_NATIVE_TOOLS = "Read", TACTICS_DISABLED_FAMILIES = "all" }

# Every phase but placement is the agent's: it also sets scopes, writes kernels in C++ and tunes their builds.
[packets.tactics-full]
extends = "tactics"
name = "Tactics (all phases)"
aliases = ["tactics-two-stage"]
tools = ["get_cpf", "view_tree", "get_work_depth", "list_move_kinds", "list_moves", "apply_move", "apply_moves", "tune_move", "run_defaults", "advance_phase", "undo_phase", "return_to_phase", "set_scope", "unset_scope", "list_scope_moves", "apply_scope_move", "finalize_scope", "list_kernels", "focus_kernel", "read_kernel", "write_kernel", "tune_kernel", "get_performance", "applied_moves", "finalize", "profile", "score", "submit"]
overlays = ["tactics:prompt/overlay.yaml", "tactics:prompt/phase-structured.yaml"]
env = { JUDGE_INPUT_MODE = "library", HPCAGENT_BENCH_NATIVE_TOOLS = "Read", TACTICS_AGENT_PHASES = "" }

# The study's ablation: tactics-full with every move family off. The agent sets scopes, writes kernel code and tunes
# builds on the canonical form's kernels; no listing offers a move, and the moves phase runs no default fusion.
[packets.tactics-full-no-moves]
extends = "tactics-full"
name = "Tactics (all phases, no moves)"
overlays = ["tactics:prompt/overlay.yaml", "tactics:prompt/phase-scopes.yaml"]
env = { JUDGE_INPUT_MODE = "library", HPCAGENT_BENCH_NATIVE_TOOLS = "Read", TACTICS_DISABLED_FAMILIES = "all", TACTICS_AGENT_PHASES = "scopes,kernels" }

# The kernels phase goes to one kernel-optimizer subagent per kernel, each with a context of its own.
[packets.tactics-subagents]
extends = "tactics-full"
name = "Tactics (kernel subagents)"
agents = ["kernel-optimizer"]
overlays = ["tactics:prompt/overlay.yaml", "tactics:prompt/phase-structured.yaml", "tactics:prompt/subagents.yaml"]

# The column an agent's Tactics run is compared against: reference moves (reference_solutions/), else the default
# moves, then the same automatic scopes, placement and code generation; no LLM.
[flavors.tactics_reference]
name = "Tactics reference"
full_name = "Tactics (reference moves)"
optimizer = "tactics_bench:ReferenceOptimizer"
extends = ["dace_cpu_canon", "dace_gpu_canon"]

# The floor of every comparison: Tactics' default moves on every kernel, then the same automatic scopes, placement
# and code generation; no LLM and no reference solution.
[flavors.tactics_default]
name = "Tactics default"
full_name = "Tactics (default moves)"
optimizer = "tactics_bench:DefaultOptimizer"
extends = ["dace_cpu_canon", "dace_gpu_canon"]

# The canonical form without wavefronts, with the default scopes, placement and code generation and no moves: what
# the study's agents start from, measured without an agent.
[flavors.tactics_cpf_nowave]
name = "Tactics CPF, no wavefronts"
full_name = "Tactics (canonical form without wavefronts, no moves)"
optimizer = "tactics_bench:NoWaveOptimizer"
extends = ["dace_cpu_canon", "dace_gpu_canon"]

# A stand-in for an LLM agent on the packet, for CI: seeded legal moves through the tools, then finalize.
[flavors.tactics_stub]
name = "Tactics stub"
full_name = "Tactics (stub agent)"
optimizer = "tactics_bench:StubAgent"
extends = ["dace_cpu_canon"]

# Two-stage Tactics for CI: a stub agent on `tactics-full`, through every phase with the judge's gate on.
[flavors.tactics_two_stage]
name = "Tactics two-stage"
full_name = "Tactics (structured, then kernels; stub agent)"
optimizer = "tactics_bench:TwoStageStub"
extends = ["dace_cpu_canon"]
