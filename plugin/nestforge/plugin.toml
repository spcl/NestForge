# NestForge as a user plugin: point HPCAGENT_BENCH_USER_PLUGIN_DIRS at this folder.
name = "nestforge"
description = "Whole-program DaCe optimization: legal moves, scoped kernels, placement, with performance feedback."
# Every kernel links LLVM libomp; the bench starts the session process in libomp's OpenMP context.
openmp = "libomp"
# The routes import the benchmark through hpcagent_bench.plugin_api only; `plugins check` enforces it.
api = 1

# The packages nestforge and nestforge_bench, built from the repository into the judge's interpreter; their
# dependencies are the benchmark's own, at its pins.
[install]
root = "../.."
command = ["uv", "pip", "install", "--python", "{python}", "--no-deps", "{root}"]

# What HPCAgent-Bench's user-plugins CI runs: the stub agent through the packet's tools, the reference and default
# columns, and the two-stage stub through every phase of the packet it walks.
[ci]
optimizers = [
    "dace_cpu_canon_nestforge_stub",
    "dace_cpu_canon_nestforge_reference",
    "dace_cpu_canon_nestforge_default",
    "dace_cpu_canon_nestforge_cpf_nowave",
    "dace_cpu_canon_nestforge_two_stage",
]
kernels = ["jacobi_1d", "tsvc_2_s231"]
language = "cpp"
packets = { dace_cpu_canon_nestforge_two_stage = "nestforge-two-stage" }

# NestForge owns its phases (nestforge/stages/phases.py): structured, scopes, scoped, kernels. A packet names the
# phases its agent runs in NESTFORGE_AGENT_PHASES (unset: every phase); NestForge runs the others' defaults and gates
# each tool by phase. advance_phase, undo_phase and return_to_phase move between them.

# The agent chooses the moves; scopes, placement, kernel code and compiler configuration run on their defaults. It
# writes no code: build and language guidance are off, and NestForge's own texts say how to send and finish.
[packets.nestforge]
name = "NestForge"
skills = ["nestforge"]
tools = ["get_cpf", "view_tree", "get_work_depth", "list_move_kinds", "list_moves", "apply_move", "apply_moves", "tune_move", "run_defaults", "get_performance", "applied_moves", "finalize", "profile", "score", "submit"]
overlays = ["nestforge:prompt/overlay.yaml", "nestforge:prompt/no-cpp-guide.yaml", "nestforge:prompt/phase-structured.yaml"]
# The judge takes only a library, and the agent has no shell or editor: what is graded is what the tools built.
env = { JUDGE_INPUT_MODE = "library", HPCAGENT_BENCH_NATIVE_TOOLS = "Read", NESTFORGE_AGENT_PHASES = "structured" }

# nestforge, and the agent may ask for a transformation no move offers (E6, round 1); E1 runs without requests.
[packets.nestforge-requests]
extends = "nestforge"
name = "NestForge (move requests)"
tools = ["get_cpf", "view_tree", "get_work_depth", "list_move_kinds", "list_moves", "apply_move", "apply_moves", "tune_move", "run_defaults", "get_performance", "applied_moves", "finalize", "profile", "score", "submit", "request_transformation"]

# The baselines that choose compiler passes instead of moves (the paper's LLVM and MLIR agents): the same program,
# entry and library as NestForge's, every kernel built through the agent's pipeline; no move, no written code.
[packets.nestforge-llvm]
extends = "nestforge"
name = "LLVM passes (baseline)"
tools = ["get_cpf", "view_tree", "set_llvm_passes", "get_performance", "applied_moves", "finalize", "profile", "score", "submit"]
overlays = ["nestforge:prompt/overlay.yaml", "nestforge:prompt/no-cpp-guide.yaml", "nestforge:prompt/passes-llvm.yaml"]
skills = []
env = { JUDGE_INPUT_MODE = "library", HPCAGENT_BENCH_NATIVE_TOOLS = "Read", NESTFORGE_DISABLED_FAMILIES = "all" }

[packets.nestforge-mlir]
extends = "nestforge"
name = "MLIR passes (baseline)"
tools = ["get_cpf", "view_tree", "set_mlir_passes", "get_performance", "applied_moves", "finalize", "profile", "score", "submit"]
overlays = ["nestforge:prompt/overlay.yaml", "nestforge:prompt/no-cpp-guide.yaml", "nestforge:prompt/passes-mlir.yaml"]
skills = []
env = { JUDGE_INPUT_MODE = "library", HPCAGENT_BENCH_NATIVE_TOOLS = "Read", NESTFORGE_DISABLED_FAMILIES = "all" }

# Every phase but placement is the agent's: it also sets scopes, writes kernels in C++ and tunes their builds.
[packets.nestforge-full]
extends = "nestforge"
name = "NestForge (all phases)"
aliases = ["nestforge-two-stage"]
tools = ["get_cpf", "view_tree", "get_work_depth", "list_move_kinds", "list_moves", "apply_move", "apply_moves", "tune_move", "run_defaults", "advance_phase", "undo_phase", "return_to_phase", "set_scope", "unset_scope", "list_scope_moves", "apply_scope_move", "place", "insert_copies", "list_kernels", "focus_kernel", "read_kernel", "write_kernel", "tune_kernel", "get_performance", "applied_moves", "finalize", "profile", "score", "submit"]
overlays = ["nestforge:prompt/overlay.yaml", "nestforge:prompt/phase-structured.yaml"]
env = { JUDGE_INPUT_MODE = "library", HPCAGENT_BENCH_NATIVE_TOOLS = "Read", NESTFORGE_AGENT_PHASES = "" }

# The study's ablation: nestforge-full with every move family off. The agent sets scopes, writes kernel code and tunes
# builds on the canonical form's kernels; no listing offers a move, and the moves phase runs no default fusion.
[packets.nestforge-full-no-moves]
extends = "nestforge-full"
name = "NestForge (all phases, no moves)"
overlays = ["nestforge:prompt/overlay.yaml", "nestforge:prompt/phase-scopes.yaml"]
env = { JUDGE_INPUT_MODE = "library", HPCAGENT_BENCH_NATIVE_TOOLS = "Read", NESTFORGE_DISABLED_FAMILIES = "all", NESTFORGE_AGENT_PHASES = "scopes,kernels" }

# The kernels phase goes to one kernel-optimizer subagent per kernel, each with a context of its own.
[packets.nestforge-subagents]
extends = "nestforge-full"
name = "NestForge (kernel subagents)"
agents = ["kernel-optimizer"]
overlays = ["nestforge:prompt/overlay.yaml", "nestforge:prompt/phase-structured.yaml", "nestforge:prompt/subagents.yaml"]

# The column an agent's NestForge run is compared against: reference moves (reference_solutions/), else the default
# moves, then the same automatic scopes, placement and code generation; no LLM.
[flavors.nestforge_reference]
name = "NestForge reference"
full_name = "NestForge (reference moves)"
optimizer = "nestforge_bench:ReferenceOptimizer"
extends = ["dace_cpu_canon", "dace_gpu_canon"]

# The floor of every comparison: NestForge's default moves on every kernel, then the same automatic scopes, placement
# and code generation; no LLM and no reference solution.
[flavors.nestforge_default]
name = "NestForge default"
full_name = "NestForge (default moves)"
optimizer = "nestforge_bench:DefaultOptimizer"
extends = ["dace_cpu_canon", "dace_gpu_canon"]

# The canonical form without wavefronts, with the default scopes, placement and code generation and no moves: what
# the study's agents start from, measured without an agent.
[flavors.nestforge_cpf_nowave]
name = "NestForge CPF, no wavefronts"
full_name = "NestForge (canonical form without wavefronts, no moves)"
optimizer = "nestforge_bench:NoWaveOptimizer"
extends = ["dace_cpu_canon", "dace_gpu_canon"]

# A stand-in for an LLM agent on the packet, for CI: seeded legal moves through the tools, then finalize.
[flavors.nestforge_stub]
name = "NestForge stub"
full_name = "NestForge (stub agent)"
optimizer = "nestforge_bench:StubAgent"
extends = ["dace_cpu_canon"]

# Two-stage NestForge for CI: a stub agent on `nestforge-full`, through every phase with the judge's gate on.
[flavors.nestforge_two_stage]
name = "NestForge two-stage"
full_name = "NestForge (structured, then kernels; stub agent)"
optimizer = "nestforge_bench:TwoStageStub"
extends = ["dace_cpu_canon"]
