# NestForge as a user plugin: point HPCAGENT_BENCH_USER_PLUGIN_DIRS at this folder.
name = "nestforge"
description = "Whole-program DaCe optimization: legal moves, scoped kernels, placement, with performance feedback."
# Every kernel links LLVM libomp; the bench starts the session process in libomp's OpenMP context.
openmp = "libomp"
# The routes import the benchmark through hpcagent_bench.plugin_api only; `plugins check` enforces it.
api = 1

# The packages nestforge and nestforge_bench, built from the repository into the judge's interpreter; their
# dependencies are the benchmark's own, at its pins.
[install]
root = "../.."
command = ["uv", "pip", "install", "--python", "{python}", "--no-deps", "{root}"]

# What HPCAgent-Bench's user-plugins CI runs: the stub agent through the packet's tools, the reference column, and the
# two-stage stub through every phase of the packet it walks.
[ci]
optimizers = [
    "dace_cpu_canon_nestforge_stub",
    "dace_cpu_canon_nestforge_reference",
    "dace_cpu_canon_nestforge_two_stage",
]
kernels = ["jacobi_1d", "tsvc_2_s231"]
language = "cpp"
packets = { dace_cpu_canon_nestforge_two_stage = "nestforge-two-stage" }

# The phases of a NestForge run, in order. A packet's `agent` names the phases the agent runs with the phase's tools;
# every other phase is its summary in the prompt and its `default` call when the agent calls next_phase (none: finalize
# builds it). Moves and scopes are the structured half; placement fixes the kernels for the unstructured half (kernels,
# codegen), and round reopens the moves for the next pass. tests/test_bench_plugin.py keeps each phase's tools those of
# its wire.py phase.
[phases.moves]
title = "Moves"
summary = "NestForge applies its default fusion."
text = "prompt/phases/moves.md"
tools = ["get_cpf", "view_tree", "list_move_kinds", "list_moves", "apply_move", "run_defaults"]
default = { tool = "run_defaults", args = { stage = "moves" } }

[phases.scopes]
title = "Scopes"
summary = "Each top-level doall, a library call included, is a kernel of its own."
text = "prompt/phases/scopes.md"
tools = ["set_scope", "unset_scope"]
default = { tool = "run_defaults", args = { stage = "scopes" } }

[phases.placement]
title = "Placement"
summary = "What no scope covers gets its default scope, which fixes the kernels; each runs on the CPU with threads, or on the GPU when the setup targets one."
default = { tool = "run_defaults", args = { stage = "placement" } }

[phases.kernels]
title = "Kernel code"
summary = "Each kernel is built from the source NestForge renders for it."
text = "prompt/phases/kernels.md"
tools = ["list_kernels", "read_kernel", "write_kernel"]

[phases.codegen]
title = "Compiler configuration"
summary = "Each kernel is built with the fastest correct compiler configuration of NestForge's sweep."
text = "prompt/phases/codegen.md"
tools = ["tune_kernel"]

[phases.round]
title = "New round"
summary = "The moves reopen on the program as they left it; its scopes and kernel code are dropped, so `score` first."
default = { tool = "run_defaults", args = { stage = "round" } }

# The agent chooses the moves; scopes, placement, kernel code and compiler configuration run on their defaults. It
# writes no code: build and language guidance are off, and NestForge's own texts say how to send and finish.
[packets.nestforge]
name = "NestForge"
skills = ["nestforge"]
agent = ["moves"]
tools = ["get_performance", "applied_moves", "finalize", "profile", "score", "submit"]
overlays = ["nestforge:prompt/overlay.yaml", "nestforge:prompt/no-cpp-guide.yaml"]
# The judge takes only a library, and the agent has no shell or editor: what is graded is what the tools built.
env = { JUDGE_INPUT_MODE = "library", HPCAGENT_BENCH_NATIVE_TOOLS = "Read" }

# Every phase but placement is the agent's: it also sets scopes, writes kernels in C++ and tunes their builds.
[packets.nestforge-full]
extends = "nestforge"
name = "NestForge (all phases)"
aliases = ["nestforge-two-stage"]
agent = ["moves", "scopes", "kernels", "codegen"]
overlays = ["nestforge:prompt/overlay.yaml"]

# The kernels phase goes to one kernel-optimizer subagent per kernel, each with a context of its own.
[packets.nestforge-subagents]
extends = "nestforge-full"
name = "NestForge (kernel subagents)"
agents = ["kernel-optimizer"]
overlays = ["nestforge:prompt/overlay.yaml", "nestforge:prompt/subagents.yaml"]

# The column an agent's NestForge run is compared against: reference moves (reference_solutions/), else the default
# moves, then the same automatic scopes, placement and code generation; no LLM.
[flavors.nestforge_reference]
name = "NestForge reference"
full_name = "NestForge (reference moves)"
optimizer = "nestforge_bench:ReferenceOptimizer"
extends = ["dace_cpu_canon", "dace_gpu_canon"]

# A stand-in for an LLM agent on the packet, for CI: seeded legal moves through the tools, then finalize.
[flavors.nestforge_stub]
name = "NestForge stub"
full_name = "NestForge (stub agent)"
optimizer = "nestforge_bench:StubAgent"
extends = ["dace_cpu_canon"]

# Two-stage NestForge for CI: a stub agent on `nestforge-full`, through every phase with the judge's gate on.
[flavors.nestforge_two_stage]
name = "NestForge two-stage"
full_name = "NestForge (structured, then kernels; stub agent)"
optimizer = "nestforge_bench:TwoStageStub"
extends = ["dace_cpu_canon"]
