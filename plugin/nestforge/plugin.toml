# NestForge as a user plugin: point HPCAGENT_BENCH_USER_PLUGIN_DIRS at this folder.
name = "nestforge"
description = "Whole-program DaCe optimization: legal moves, scoped kernels, placement, with performance feedback."

# The packages nestforge and nestforge_bench, built from the repository into the judge's interpreter; their
# dependencies are the benchmark's own, at its pins.
[install]
root = "../.."
command = ["uv", "pip", "install", "--python", "{python}", "--no-deps", "{root}"]

# What HPCAgent-Bench's user-plugins CI runs: the stub agent through the packet's tools, and the reference column.
[ci]
optimizers = ["dace_cpu_canon_nestforge_stub", "dace_cpu_canon_nestforge_reference"]
kernels = ["jacobi_1d", "tsvc_2_s231"]
language = "cpp"

[packets.nestforge]
name = "NestForge"
method = "nestforge"
# The structured phase: scopes, placement and kernel builds run their defaults (finalize, get_performance). Every
# tool is one the session serves (nestforge.server.CALLS); a test keeps them in the structured and any phases.
tools = ["get_cpf", "view_tree", "list_move_kinds", "list_moves", "apply_move", "run_defaults", "get_performance",
    "finalize"]

# The agent writes no code. In-process prompt: no build flags, no hand-optimization or language guide, a delivery
# that is finalize's library. Cluster prompt (agent_*): no build line, syntax check or index-buffer rule; sending,
# failures, end to end and keep improving are NestForge's. Both say what NestForge does after the intro. The user's
# own prompt keys still win.
[packets.nestforge.prompt]
template_dirs = ["prompts"]
append = { intro = "nestforge/what_it_does.md", agent_intro = "nestforge/what_it_does.md" }

[packets.nestforge.prompt.sections]
build_flags = false
optimizations = false
lang_cpp = false
lang_fortran = false
delivery = "nestforge/delivery.j2"
agent_build = false
agent_syntax_check = false
agent_index_buffers = false
agent_sending_code = "nestforge/agent/sending_code.md"
agent_failures = "nestforge/agent/failures.md"
agent_end_to_end = "nestforge/agent/end_to_end.md"
agent_keep_improving = "nestforge/agent/keep_improving.md"

# The column an agent's NestForge run is compared against: reference moves (reference_solutions/), else the default
# moves, then the same automatic scopes, placement and code generation; no LLM.
[flavors.nestforge_reference]
name = "NestForge reference"
full_name = "NestForge (reference moves)"
optimizer = "nestforge_bench:ReferenceOptimizer"
extends = ["dace_cpu_canon", "dace_gpu_canon"]

# A stand-in for an LLM agent on the packet, for CI: seeded legal moves through the tools, then finalize.
[flavors.nestforge_stub]
name = "NestForge stub"
full_name = "NestForge (stub agent)"
optimizer = "nestforge_bench:StubAgent"
extends = ["dace_cpu_canon"]
