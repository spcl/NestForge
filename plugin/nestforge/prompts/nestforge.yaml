# NestForge's packet: the agent writes no code. Task prompt: no build flags, no hand-optimization or language guide,
# a delivery that is finalize's library. Agent prompt: no build line, syntax check or index-buffer rule; sending,
# failures, end to end and keep improving are NestForge's. Both say what NestForge does after the intro.
agent:
  set:
    build: {enabled: false}
    syntax_check: {enabled: false}
    index_buffers: {enabled: false}
    sending_code: {text: "file:nestforge/agent/sending_code.md"}
    failures: {text: "file:nestforge/agent/failures.md"}
    end_to_end: {text: "file:nestforge/agent/end_to_end.md"}
    keep_improving: {text: "file:nestforge/agent/keep_improving.md"}
  insert:
    - {after: intro, block: {id: nestforge, text: "file:nestforge/what_it_does.md"}}
task:
  set:
    build_flags: {enabled: false}
    optimizations: {enabled: false}
    lang_cpp: {enabled: false}
    lang_fortran: {enabled: false}
    delivery: {text: "file:nestforge/delivery.j2"}
  insert:
    - {after: intro, block: {id: nestforge, text: "file:nestforge/what_it_does.md"}}
